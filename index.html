<!DOCTYPE html>
<html lang="en">
<head>

<title>Nightingale Desk - NMCN RN prep</title>
<style>
:root {
  --background: #f4f6f8; --foreground: #1c2428; --muted: #5d6b73; --card: #ffffff;
  --border: #d7dee3; --primary: #0f6e66; --primary-fg: #f4fffd; --danger: #9d3b32;
  --ok: #1d6b45; --ring: #0f6e66; --shadow: 0 1px 2px rgb(28 36 40 / .06);
  --radius: 12px; --ease: cubic-bezier(0.23, 1, 0.32, 1);
  font: 100%/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  color: var(--foreground); background: var(--background);
}
@media (prefers-color-scheme: dark) {
  :root { --background:#12181b; --foreground:#e7eef1; --muted:#9aabb4; --card:#1b2428; --border:#2c3940; --primary:#3dbeaf; --primary-fg:#06211e; --danger:#e07a72; --ok:#7dcea5; --ring:#3dbeaf; --shadow:none; }
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100dvh; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.skip { position: absolute; left: .6rem; top: -3rem; background: var(--primary); color: var(--primary-fg); padding: .4rem .7rem; border-radius: 8px; }
.skip:focus { top: .6rem; }
.app { max-width: 880px; margin: 0 auto; padding: 1rem 1rem 6.4rem; }
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; margin-bottom: 1rem; }
.mark { font-size: 1.15rem; font-weight: 620; letter-spacing: -.02em; }
.mark span { display: block; font-family: inherit; font-weight: 500; letter-spacing: .04em; text-transform: uppercase; font-size: .68rem; color: var(--muted); margin-bottom: .15rem; }
h1,h2,h3 { font-weight: 620; letter-spacing: -.03em; line-height: 1.15; margin: 0 0 .35rem; text-wrap: balance; }
.sub,.note { color: var(--muted); font-size: .92rem; max-width: 65ch; }
.grid { display: grid; gap: .7rem; }
.stats { grid-template-columns: 1fr 1fr; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: .9rem 1rem; box-shadow: var(--shadow); }
.k { font-size: 1.6rem; font-weight: 620; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.lbl { color: var(--muted); font-size: .75rem; }
.actions { display: flex; flex-wrap: wrap; gap: .5rem; margin: .85rem 0; }
.btn,.row,.opt,.chip,.qgrid button { transition: transform 140ms var(--ease), background 140ms ease, border-color 140ms ease; }
.btn:active,.row:active,.opt:active { transform: scale(0.98); }
.btn { border: 0; border-radius: 10px; padding: .7rem .95rem; background: var(--primary); color: var(--primary-fg); font-weight: 590; }
.btn.ghost { background: transparent; color: var(--foreground); border: 1px solid var(--border); }
.btn.warn { background: var(--danger); color: #fff; }
.btn:disabled { opacity: .45; }
.nav { position: fixed; left: .7rem; right: .7rem; bottom: .55rem; display: flex; justify-content: space-between; gap: .2rem; padding: .35rem; border-radius: 16px; z-index: 4; background: color-mix(in srgb, var(--card) 78%, transparent); border: 1px solid var(--border); backdrop-filter: blur(18px) saturate(1.4); box-shadow: 0 10px 30px rgb(18 24 27 / .12); }
.nav button { flex: 1; border: 0; background: transparent; color: var(--muted); border-radius: 12px; padding: .55rem .2rem; font-size: .72rem; font-weight: 560; }
.nav button.on { background: var(--foreground); color: var(--background); }
.qstem { font-size: 1.05rem; line-height: 1.45; margin: .35rem 0 .8rem; }
.opt { width: 100%; text-align: left; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: .78rem .85rem; margin-bottom: .45rem; }
.opt.on { border-color: var(--primary); background: color-mix(in srgb, var(--primary) 10%, var(--card)); }
.opt.good { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, var(--card)); }
.opt.bad { border-color: var(--danger); background: color-mix(in srgb, var(--danger) 12%, var(--card)); }
.meta { display: flex; justify-content: space-between; gap: .6rem; color: var(--muted); font-size: .82rem; }
.timer { font-variant-numeric: tabular-nums; font-weight: 640; color: var(--foreground); }
.timer.hot { color: var(--danger); }
.rationale { background: color-mix(in srgb, var(--primary) 8%, var(--card)); border-radius: 10px; padding: .75rem; margin-top: .35rem; }
.qgrid { display: grid; grid-template-columns: repeat(8, 1fr); gap: .3rem; margin-top: .7rem; }
.qgrid button { border: 1px solid var(--border); background: var(--card); border-radius: 8px; padding: .38rem 0; font-size: .75rem; font-variant-numeric: tabular-nums; }
.qgrid button.done { background: color-mix(in srgb, var(--primary) 14%, var(--card)); }
.qgrid button.flag { outline: 2px solid #9a7340; }
.qgrid button.cur { background: var(--foreground); color: var(--background); }
.row { width: 100%; text-align: left; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: .8rem .9rem; margin-bottom: .5rem; }
.step { display: flex; gap: .6rem; align-items: flex-start; margin: .4rem 0; }
.step input { margin-top: .3rem; width: 1.05rem; height: 1.05rem; }
.warnbox { border-left: 3px solid var(--primary); padding-left: .7rem; }
#cans { width: 100%; padding: .75rem .8rem; border-radius: 10px; border: 1px solid var(--border); background: var(--card); }
@media (hover: hover) and (pointer: fine) {
  .btn:hover { filter: brightness(1.05); }
  .row:hover, .opt:hover { border-color: color-mix(in srgb, var(--primary) 45%, var(--border)); }
}
@media (prefers-reduced-motion: reduce) { .btn,.row,.opt,.chip,.qgrid button { transition: none; } }
@media (prefers-reduced-transparency: reduce) { .nav { background: var(--card); backdrop-filter: none; } }
@media (min-width: 800px) {
  .app { padding-bottom: 2rem; }
  .stats { grid-template-columns: repeat(4, 1fr); }
  .nav { position: static; margin: 0 0 1rem; background: transparent; border: 0; box-shadow: none; backdrop-filter: none; padding: 0; justify-content: flex-start; }
  .nav button { flex: 0; padding: .45rem .75rem; }
  .qgrid { grid-template-columns: repeat(12, 1fr); }
}
</style>

ld be administered as prescribed, with close monitoring of oxygenation and respiratory status."}, {"id": "bank15", "section": "Pharmacology", "topic": "Pharmacology", "source": "Your question bank", "stem": "The nurse is caring for a patient in a clinical setting. Before administering digoxin, which assessment is especially important?", "options": ["Apical pulse", "Visual acuity only", "Bowel sounds only", "Skin temperature only"], "answer": 0, "rationale": "The apical pulse should be assessed before digoxin because bradycardia can indicate a reason to hold the medication according to prescribed parameters."}, {"id": "bank16", "section": "Pharmacology", "topic": "Pharmacology", "source": "Your question bank", "stem": "During a nursing review, the nurse asks: Which medication class commonly reduces gastric acid secretion by blocking the proton pump?", "options": ["Proton pump inhibitors", "Loop diuretics", "Beta blockers", "Anticoagulants"], "answer": 0, "rationale": "Proton pump inhibitors suppress gastric acid secretion by inhibiting the H+/K+-ATPase proton pump in gastric parietal cells."}, {"id": "bank17", "section": "Pharmacology", "topic": "Pharmacology", "source": "Your question bank", "stem": "A student nurse is being evaluated. A patient receiving heparin develops unexpected bleeding. Which laboratory test is commonly used to monitor unfractionated heparin therapy?", "options": ["aPTT", "HbA1c", "Serum sodium", "Bilirubin"], "answer": 0, "rationale": "Activated partial thromboplastin time is commonly used to monitor unfractionated heparin, depending on the institution's protocol."}, {"id": "bank18", "section": "Pharmacology", "topic": "Pharmacology", "source": "Your question bank", "stem": "A nurse is preparing for safe patient care. Which instruction is appropriate for a patient taking warfarin?", "options": ["Keep vitamin K intake consistent and attend ordered INR monitoring.", "Double the next dose if one is missed.", "Stop the medication when bruising oc <script>
const BANK = JSON.parse(document.getElementById("bank").textContent);
const OSCE = JSON.parse(document.getElementById("osce").textContent);
const SYL = JSON.parse(document.getElementById("syllabus").textContent);
const KEY = "nmcn-desk-v1";
const state = load();
let view = "home";
let session = null;
let tick = null;
let osceRun = null;

function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || blank(); }
  catch { return blank(); }
}
function blank() { return { answers: {}, osce: {}, calcs: { n: 0, ok: 0 } }; }
function save() { localStorage.setItem(KEY, JSON.stringify(state)); }
function $(s, r=document) { return r.querySelector(s); }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&','<':'<','>':'>','"':'"'}[c])); }

function stats() {
  const ids = Object.keys(state.answers);
  const n = ids.length;
  const ok = ids.filter(id => state.answers[id].ok).length;
  const by = {};
  BANK.forEach(q => {
    by[q.section] = by[q.section] || { n: 0, ok: 0, total: 0 };
    by[q.section].total++;
    if (state.answers[q.id]) { by[q.section].n++; if (state.answers[q.id].ok) by[q.section].ok++; }
  });
  return { n, ok, pct: n ? Math.round(ok / n * 100) : 0, by };
}

function render() {
  const nav = [
    ["home","Home"],["practice","Practice"],["cbt","CBT"],["osce","OSCE"],["review","Review"]
  ];
  $("#nav").innerHTML = nav.map(([id, label]) =>
    `<button class="${view===id?'on':''}" data-go="${id}">${label}</button>`).join("");
  $("#nav").onclick = e => { const b = e.target.closest("[data-go]"); if (!b) return; stopTick(); view = b.dataset.go; session = null; render(); };
  const v = $("#view");
  if (view === "home") v.innerHTML = home();
  if (view === "practice") v.innerHTML = practiceHome();
  if (view === "cbt") v.innerHTML = session ? exam() : cbtHome();
  if (view === "osce") v.innerHTML = osceRun ? osceView() : osceHome();
  if (view === "review") v.innerHTML = review();
  bind();
}
function bind() {
  document.querySelectorAll("[data-act]").forEach(el => el.onclick = onAct);
}

function home() {
  const s = stats();
  const bars = Object.entries(s.by).map(([name, b]) => {
    const p = b.n ? Math.round(b.ok / b.n * 100) : 0;
    return `<div class="card"><div class="lbl">${esc(name)}</div><div class="k">${b.n?p+'%':'-'}</div><div class="note">${b.ok}/${b.n} correct · ${b.total} in bank</div></div>`;
  }).join("");
  return `
    <p class="sub">A desk for the Nursing and Midwifery Council of Nigeria RN exam: timed CBT, tutor practice, OSCE talk-throughs, and the unique items from your attached bank.</p>
    <div class="grid stats" style="margin-top:1rem">
      <div class="card"><div class="lbl">Answered</div><div class="k">${s.n}</div><div class="note">of ${BANK.length} unique items from your bank</div></div>
      <div class="card"><div class="lbl">Accuracy</div><div class="k">${s.n?s.pct+'%':'-'}</div><div class="note">${s.ok} correct</div></div>
      <div class="card"><div class="lbl">OSCE drills</div><div class="k">${Object.keys(state.osce).length}</div><div class="note">of ${OSCE.length} stations</div></div>
      <div class="card"><div class="lbl">Drug calc</div><div class="k">${state.calcs.n?Math.round(state.calcs.ok/state.calcs.n*100)+'%':'-'}</div><div class="note">${state.calcs.ok}/${state.calcs.n} correct</div></div>
    </div>
    <div class="actions">
      <button class="btn" data-act="start-cbt" data-n="50">Start 50-item CBT</button>
      <button class="btn ghost" data-act="go" data-view="practice">Practice by topic</button>
      <button class="btn ghost" data-act="go" data-view="osce">OSCE stations</button>
    </div>
    <div class="grid" style="margin-top:.9rem">${bars}</div>
    <div class="card" style="margin-top:.9rem">
      <h3>How this exam is usually run</h3>
      <p class="note">Recent NMCN professional exams use a computer-based objective paper plus an OSCE of about 12 stations, roughly 5 minutes each. Candidate notices have described an objective paper of about 250 items in 2 hours 30 minutes. Pass mark is commonly cited at 50%. Confirm the notice for your own diet - papers and timing can change.</p>
      <p class="note warnbox">This desk uses your spreadsheet, NCLEX_5000_Question_Bank.xlsx. It has 5,000 rows and 25 unique stems: the same items repeated with the options rotated. Duplicates are removed so a paper is not the same five questions over and over. Nothing else has been added to the bank.</p>
    </div>
    <div class="card" style="margin-top:.8rem">
      <h3>Syllabus map</h3>
      ${SYL.map(b => `<p><strong>${esc(b.paper)}</strong> · ${esc(b.weight)}</p><ul>${b.items.map(i => `<li>${esc(i)}</li>`).join("")}</ul>`).join("")}
    </div>`;
}
function practiceHome() {
  const secs = [...new Set(BANK.map(q => q.section))];
  return `<h2>Practice</h2><p class="note">Tutor mode shows the rationale after each item. Letters are shuffled each time.</p>
    <div class="actions">
      <button class="btn" data-act="practice" data-sec="all">Mixed set</button>
      <button class="btn ghost" data-act="calc">Drug calculation drill</button>
    </div>
    ${secs.map(s => `<button class="row" data-act="practice" data-sec="${esc(s)}"><strong>${esc(s)}</strong><div class="note">${BANK.filter(q=>q.section===s).length} items</div></button>`).join("")}`;
}
function cbtHome() {
  return `<h2>CBT</h2><p class="note">No rationales until you submit. Flag items and move on, the way a centre exam forces you to.</p>
    <div class="actions">
      <button class="btn" data-act="start-cbt" data-n="25">25 items · 15 min</button>
      <button class="btn" data-act="start-cbt" data-n="50">50 items · 30 min</button>
      <button class="btn ghost" data-act="start-cbt" data-n="100">100 items · 60 min</button>
    </div>
    <p class="note">Timing is about 36 seconds an item, the pace of a 250-item paper in 150 minutes. A full 250 is not useful here: the bank is not that large, and half of a long paper would be repeats.</p>`;
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function makeSession(list, mode, minutes) {
  session = {
    mode, minutes, left: minutes * 60, idx: 0, flag: {},
    items: shuffle(list).map(q => {
      const order = shuffle([0,1,2,3]);
      return { ...q, order, pick: null };
    })
  };
  if (mode === "cbt") startTick();
}
function startTick() {
  stopTick();
  tick = setInterval(() => {
    if (!session) return;
    session.left--;
    const el = $("#clock");
    if (el) { el.textContent = fmt(session.left); el.classList.toggle("hot", session.left < 60); }
    if (session.left <= 0) { stopTick(); finish(); }
  }, 1000);
}
function stopTick() { if (tick) clearInterval(tick); tick = null; }
function fmt(s) { s = Math.max(0, s); return String(Math.floor(s/60)).padStart(2,"0") + ":" + String(s%60).padStart(2,"0"); }

function exam() {
  const q = session.items[session.idx];
  const letters = "ABCD";
  const opts = q.order.map((oi, i) => {
    let cls = "opt";
    if (q.pick === i) cls += " on";
    if (session.mode === "tutor" && q.pick != null) {
      if (oi === q.answer) cls += " good";
      else if (q.pick === i) cls += " bad";
    }
    return `<button class="${cls}" data-act="pick" data-i="${i}">${letters[i]}. ${esc(q.options[oi])}</button>`;
  }).join("");
  const why = session.mode === "tutor" && q.pick != null
    ? `<div class="rationale"><strong>${q.order[q.pick]===q.answer?"Correct.":"Not this one."}</strong> ${esc(q.rationale)}<div class="note" style="margin-top:.35rem">${esc(q.source)} · ${esc(q.topic||q.section)}</div></div>` : "";
  const grid = session.mode === "cbt" ? `<div class="qgrid">${session.items.map((it, i) =>
    `<button class="${i===session.idx?"cur":""} ${it.pick!=null?"done":""} ${session.flag[i]?"flag":""}" data-act="jump" data-i="${i}">${i+1}</button>`).join("")}</div>` : "";
  return `<div class="meta"><span>${esc(q.section)}</span><span class="timer ${session.left<60?"hot":""}" id="clock">${session.mode==="cbt"?fmt(session.left):"Tutor"}</span></div>
    <div class="note">${session.idx+1} of ${session.items.length}${session.flag[session.idx]?" · flagged":""}</div>
    <h2 class="qstem">${esc(q.stem)}</h2>
    ${opts}${why}
    <div class="actions">
      <button class="btn ghost" data-act="prev" ${session.idx?"":"disabled"}>Back</button>
      <button class="btn ghost" data-act="flag">Flag</button>
      <button class="btn" data-act="next">${session.idx===session.items.length-1?(session.mode==="cbt"?"Submit":"Done"):"Next"}</button>
    </div>${grid}`;
}
function finish() {
  stopTick();
  const items = session.items;
  let ok = 0;
  items.forEach(q => {
    const correct = q.pick != null && q.order[q.pick] === q.answer;
    if (correct) ok++;
    state.answers[q.id] = { ok: correct, at: Date.now() };
  });
  save();
  const pct = Math.round(ok / items.length * 100);
  session.result = { ok, pct };
  $("#view").innerHTML = `<h2>${pct}%</h2><p class="note">${ok} of ${items.length} correct. A working pass line often quoted for NMCN is 50%. This score is practice, not a Council result.</p>
    <div class="actions"><button class="btn" data-act="reveal">Review paper</button><button class="btn ghost" data-act="go" data-view="home">Home</button></div>
    <div id="paper"></div>`;
  bind();
}
function reveal() {
  const html = session.items.map((q, n) => {
    const correct = q.pick != null && q.order[q.pick] === q.answer;
    const yours = q.pick == null ? "blank" : q.options[q.order[q.pick]];
    return `<div class="card" style="margin-top:.6rem"><div class="note">${n+1}. ${correct?"Correct":"Missed"}</div><div class="qstem">${esc(q.stem)}</div><div class="note">Your answer: ${esc(yours)}</div><div class="note">Key: ${esc(q.options[q.answer])}</div><div class="rationale">${esc(q.rationale)}</div></div>`;
  }).join("");
  $("#paper").innerHTML = html;
}

function onAct(e) {
  const el = e.currentTarget;
  const act = el.dataset.act;
  if (act === "go") { view = el.dataset.view; session = null; osceRun = null; render(); }
  if (act === "start-cbt") {
    const n = +el.dataset.n;
    const mins = n === 25 ? 15 : n === 100 ? 60 : 30;
    makeSession(BANK, "cbt", mins);
    session.items = session.items.slice(0, Math.min(n, session.items.length));
    view = "cbt"; render();
  }
  if (act === "practice") {
    const sec = el.dataset.sec;
    const list = sec === "all" ? BANK : BANK.filter(q => q.section === sec);
    makeSession(list, "tutor", 0);
    view = "cbt"; render();
  }
  if (act === "pick" && session) {
    const q = session.items[session.idx];
    if (session.mode === "tutor" && q.pick != null) return;
    q.pick = +el.dataset.i;
    if (session.mode === "tutor") {
      const ok = q.order[q.pick] === q.answer;
      state.answers[q.id] = { ok, at: Date.now() };
      save();
    }
    render();
  }
  if (act === "next" && session) {
    if (session.idx === session.items.length - 1) {
      if (session.mode === "cbt") finish();
      else { view = "home"; session = null; render(); }
    } else { session.idx++; render(); }
  }
  if (act === "prev" && session && session.idx) { session.idx--; render(); }
  if (act === "flag" && session) { session.flag[session.idx] = !session.flag[session.idx]; render(); }
  if (act === "jump" && session) { session.idx = +el.dataset.i; render(); }
  if (act === "reveal") reveal();
  if (act === "osce") { osceRun = { id: el.dataset.id, left: 300, checks: {} }; startOsce(); view = "osce"; render(); }
  if (act === "check") {
    osceRun.checks[el.dataset.i] = el.checked;
  }
  if (act === "osce-done") {
    const st = OSCE.find(s => s.id === osceRun.id);
    const n = Object.values(osceRun.checks).filter(Boolean).length;
    state.osce[osceRun.id] = { n, total: st.steps.length, at: Date.now() };
    save(); osceRun = null; stopTick(); render();
  }
  if (act === "calc") calc();
  if (act === "calc-check") checkCalc();
  if (act === "reset") { if (confirm("Clear all scores on this device?")) { localStorage.removeItem(KEY); Object.assign(state, blank()); state.answers={}; state.osce={}; state.calcs={n:0,ok:0}; render(); } }
}
function startOsce() {
  stopTick();
  tick = setInterval(() => {
    if (!osceRun) return;
    osceRun.left--;
    const el = $("#clock");
    if (el) { el.textContent = fmt(osceRun.left); el.classList.toggle("hot", osceRun.left < 30); }
    if (osceRun.left <= 0) stopTick();
  }, 1000);
}
function osceHome() {
  return `<h2>OSCE desk</h2><p class="note">Twelve stations in the shape of the Council practical: procedure and question. These are study checklists, not the live mark sheet. Five minutes each.</p>
    ${OSCE.map(s => {
      const done = state.osce[s.id];
      return `<button class="row" data-act="osce" data-id="${s.id}"><strong>${esc(s.name)}</strong> · ${esc(s.kind)}<div class="note">${done?done.n+"/"+done.total+" steps marked":"Not drilled"}</div></button>`;
    }).join("")}`;
}
function osceView() {
  const st = OSCE.find(s => s.id === osceRun.id);
  return `<div class="meta"><span>${esc(st.kind)} station</span><span class="timer" id="clock">${fmt(osceRun.left)}</span></div>
    <h2>${esc(st.name)}</h2><p class="qstem">${esc(st.prompt)}</p>
    ${st.steps.map((step, i) => `<label class="step"><input type="checkbox" data-act="check" data-i="${i}" ${osceRun.checks[i]?"checked":""}> <span>${esc(step)}</span></label>`).join("")}
    <div class="actions"><button class="btn" data-act="osce-done">Save station</button><button class="btn ghost" data-act="go" data-view="osce">Leave</button></div>
    <p class="note">Say each step aloud. In a live OSCE, unspoken work is often unmarked.</p>`;
}
function review() {
  const missed = BANK.filter(q => state.answers[q.id] && !state.answers[q.id].ok);
  return `<h2>Review</h2><p class="note">${missed.length} items last answered wrong.</p>
    <div class="actions"><button class="btn" data-act="redo" ${missed.length?"":"disabled"}>Retry missed</button><button class="btn ghost" data-act="reset">Reset scores</button></div>
    ${missed.map(q => `<div class="card" style="margin-top:.6rem"><div class="qstem">${esc(q.stem)}</div><div class="note">Key: ${esc(q.options[q.answer])}</div><div class="rationale">${esc(q.rationale)}</div></div>`).join("") || "<p class='note'>Nothing in the missed pile yet.</p>"}`;
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act='redo']");
  if (!b) return;
  const missed = BANK.filter(q => state.answers[q.id] && !state.answers[q.id].ok);
  makeSession(missed, "tutor", 0); view = "cbt"; render();
});

let calcQ = null;
function calc() {
  const kind = Math.random() < .5 ? "drip" : "dose";
  if (kind === "drip") {
    const vol = [250,500,1000][Math.floor(Math.random()*3)];
    const hrs = [2,4,5,8][Math.floor(Math.random()*4)];
    const df = [15,20][Math.floor(Math.random()*2)];
    calcQ = { kind, ans: Math.round((vol * df) / (hrs * 60)), text: `${vol} mL is to infuse over ${hrs} hours. Drop factor ${df} drops/mL. Drops per minute?` };
  } else {
    const have = [125,250,500][Math.floor(Math.random()*3)];
    const want = have * [0.5,1,2][Math.floor(Math.random()*3)];
    calcQ = { kind, ans: want / have, text: `Prescribed ${want} mg. Stock is ${have} mg per tablet. How many tablets?` };
  }
  $("#view").innerHTML = `<h2>Drug calculation</h2><p class="qstem">${esc(calcQ.text)}</p>
    <input id="cans" inputmode="decimal" style="width:100%;padding:.8rem;border-radius:12px;border:1px solid var(--line)" placeholder="Your figure">
    <div class="actions"><button class="btn" data-act="calc-check">Check</button><button class="btn ghost" data-act="calc">New sum</button></div>
    <div id="cout"></div><p class="note">Drip rate = (mL × drop factor) ÷ minutes. Tablets = desired ÷ stock.</p>`;
  bind();
}
function checkCalc() {
  const v = parseFloat($("#cans").value);
  const ok = Math.abs(v - calcQ.ans) < 0.05;
  state.calcs.n++; if (ok) state.calcs.ok++; save();
  $("#cout").innerHTML = `<div class="rationale">${ok?"Correct.":"Not quite."} Answer: ${calcQ.ans}</div>`;
}
render();
</script>
</body>
</html>
